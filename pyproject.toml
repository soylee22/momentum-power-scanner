[project]
name = "momentum-power-scanner"
version = "0.1.0"
description = "Weekly Minervini Stage 2 + IBD-style RS scanner over S&P 500 + FTSE 100. Top 10 momentum names, Palantir-aesthetic outputs."
requires-python = ">=3.11"
dependencies = [
  "yfinance>=0.2.40",
  "pandas>=2.1",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "jinja2>=3.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mscan = "momentum.scanner:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
